[project]
name = "codex-desktop-demo"
version = "0.1.0"
description = "基于 Codex App Server 的桌面 Agent 最小化 Demo"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.0",
    "websockets>=13.0",
    "toml>=0.10",
]

[project.scripts]
codex-demo = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
